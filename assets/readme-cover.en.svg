<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Pi Model Handoff — Switch models. Keep the thread.</title>
  <desc id="desc">Per-model isolated lanes, bounded context handoffs, and on-demand thread history lookup in Pi.</desc>
  <rect width="1200" height="440" fill="#f8f7f3"/>
  <g fill="#252923" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="52" font-size="20" font-weight="600">Pi Model Handoff</text>
    <text x="1144" y="52" text-anchor="end" font-size="12" letter-spacing="2" fill="#62675e">SWITCH MODELS WITHOUT LOSING THE THREAD</text>
    <path d="M56 80H1144 M736 120V344 M56 384H1144" fill="none" stroke="#d5d7cb"/>
    <g font-family="Georgia, Songti SC, STSong, serif" font-size="72" letter-spacing="-2">
      <text x="56" y="200">Switch models.</text>
      <text x="56" y="288" fill="#3e6148">Keep the thread.</text>
    </g>
    <text x="56" y="340" font-size="17" fill="#62675e">Bounded context handoffs across models in Pi.</text>
    <text x="776" y="136" fill="#3e6148" font-size="12" font-family="monospace">01</text>
    <text x="816" y="136" font-size="20">Lanes, isolated.</text>
    <text x="816" y="164" font-size="13" fill="#62675e">Per-model history · Cache-stable capsules</text>
    <text x="776" y="224" fill="#3e6148" font-size="12" font-family="monospace">02</text>
    <text x="816" y="224" font-size="20">Handoffs, bounded.</text>
    <text x="816" y="252" font-size="13" fill="#62675e">First &amp; delta summaries · Token budget cap</text>
    <text x="776" y="312" fill="#3e6148" font-size="12" font-family="monospace">03</text>
    <text x="816" y="312" font-size="20">History, on demand.</text>
    <text x="816" y="340" font-size="13" fill="#62675e">thread_history_read · Live green status</text>
    <text x="56" y="416" font-size="12" letter-spacing="1" fill="#62675e">PI MODEL HANDOFF / BOUNDED CONTEXT ACROSS MODELS</text>
    <text x="1144" y="416" text-anchor="end" font-size="12" fill="#62675e">OPEN SOURCE · MIT</text>
  </g>
</svg>
